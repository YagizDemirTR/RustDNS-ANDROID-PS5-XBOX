[package]
name = "rustdns_android"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-proto = "0.24"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
once_cell = "1.19"
local-ip-address = "0.6"
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

